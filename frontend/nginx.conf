server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # CesiumJS static assets — long cache
    location ~* \.(wasm|glb|gltf|terrain|quantized-mesh)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # JS/CSS bundles — cache by hash filename
    location ~* \.(js|css|woff2|woff|ttf|png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API / WS — never cache, proxy not needed here
    # (nginx reverse-proxy in infra/nginx handles /api/, /ws/, /tiles/)

    # SPA fallback — named location avoids redirect loop
    location / {
        try_files $uri $uri/ @spa_fallback;
    }
    location @spa_fallback {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Health check
    location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
